[package]
name = "beethoven"
description = "A Trait-based client that lets you compose programs extremely easily"
version = "0.0.1"
license = "MIT"
edition = "2021"

[features]
default = ["deposit", "swap"]

# Test program selection (for dev-dependencies)
upstream-bpf = []

# Action groups
deposit = ["kamino-deposit", "jupiter-deposit", "drift-deposit", "marginfi-deposit"]
swap = [
    "perena-swap",
    "solfi-swap",
    "solfi_v2-swap",
    "manifest-swap",
    "heaven-swap",
    "aldrin-swap",
    "aldrin_v2-swap",
    "futarchy-swap",
    "gamma-swap",
    "scale_amm-swap",
    "scale_vmm-swap",
    "omnipair-swap",
    "hadron-swap",
    "raydium-cpmm-swap",
]

# Deposit protocols
kamino-deposit = ["dep:beethoven-deposit-kamino"]
jupiter-deposit = ["dep:beethoven-deposit-jupiter"]
drift-deposit = ["dep:beethoven-deposit-drift"]
marginfi-deposit = ["dep:beethoven-deposit-marginfi"]

# Swap protocols
perena-swap = ["dep:beethoven-swap-perena"]
solfi-swap = ["dep:beethoven-swap-solfi"]
solfi_v2-swap = ["dep:beethoven-swap-solfi-v2"]
manifest-swap = ["dep:beethoven-swap-manifest"]
heaven-swap = ["dep:beethoven-swap-heaven"]
aldrin-swap = ["dep:beethoven-swap-aldrin"]
aldrin_v2-swap = ["dep:beethoven-swap-aldrin-v2"]
futarchy-swap = ["dep:beethoven-swap-futarchy"]
gamma-swap = ["dep:beethoven-swap-gamma"]
scale_amm-swap = ["dep:beethoven-swap-scale-amm"]
scale_vmm-swap = ["dep:beethoven-swap-scale-vmm"]
omnipair-swap = ["dep:beethoven-swap-omnipair"]
hadron-swap = ["dep:beethoven-swap-hadron"]
raydium-cpmm-swap = ["dep:beethoven-swap-raydium-cpmm"]

[dependencies]
beethoven-core.workspace = true
solana-account-view.workspace = true
solana-address.workspace = true
solana-instruction-view.workspace = true
solana-program-error.workspace = true

# Optional protocol crates
beethoven-deposit-kamino = { workspace = true, optional = true }
beethoven-deposit-jupiter = { workspace = true, optional = true }
beethoven-deposit-drift = { workspace = true, optional = true }
beethoven-deposit-marginfi = { workspace = true, optional = true }
beethoven-swap-perena = { workspace = true, optional = true }
beethoven-swap-solfi = { workspace = true, optional = true }
beethoven-swap-solfi-v2 = { workspace = true, optional = true }
beethoven-swap-manifest = { workspace = true, optional = true }
beethoven-swap-heaven = { workspace = true, optional = true }
beethoven-swap-aldrin = { workspace = true, optional = true }
beethoven-swap-aldrin-v2 = { workspace = true, optional = true }
beethoven-swap-futarchy = { workspace = true, optional = true }
beethoven-swap-gamma = { workspace = true, optional = true }
beethoven-swap-scale-amm = { workspace = true, optional = true }
beethoven-swap-scale-vmm = { workspace = true, optional = true }
beethoven-swap-omnipair = { workspace = true, optional = true }
beethoven-swap-hadron = { workspace = true, optional = true }
beethoven-swap-raydium-cpmm = { workspace = true, optional = true }

[workspace]
members = [
    "crates/core",
    "crates/deposit/kamino",
    "crates/deposit/jupiter",
    "crates/deposit/drift",
    "crates/deposit/marginfi",
    "crates/swap/perena",
    "crates/swap/solfi",
    "crates/swap/solfi-v2",
    "crates/swap/manifest",
    "crates/swap/heaven",
    "crates/swap/aldrin",
    "crates/swap/aldrin-v2",
    "crates/swap/futarchy",
    "crates/swap/gamma",
    "crates/swap/scale-amm",
    "crates/swap/scale-vmm",
    "crates/swap/omnipair",
    "crates/swap/hadron",
    "crates/swap/raydium-cpmm",
    "program-test",
    "crates/client",
]

[workspace.dependencies]
beethoven = { path = "." }
beethoven-core = { path = "crates/core" }
beethoven-client = { path = "crates/client" }
beethoven-deposit-kamino = { path = "crates/deposit/kamino" }
beethoven-deposit-jupiter = { path = "crates/deposit/jupiter" }
beethoven-deposit-drift = { path = "crates/deposit/drift" }
beethoven-deposit-marginfi = { path = "crates/deposit/marginfi" }
beethoven-swap-perena = { path = "crates/swap/perena" }
beethoven-swap-solfi = { path = "crates/swap/solfi" }
beethoven-swap-solfi-v2 = { path = "crates/swap/solfi-v2" }
beethoven-swap-manifest = { path = "crates/swap/manifest" }
beethoven-swap-heaven = { path = "crates/swap/heaven" }
beethoven-swap-aldrin = { path = "crates/swap/aldrin" }
beethoven-swap-aldrin-v2 = { path = "crates/swap/aldrin-v2" }
beethoven-swap-futarchy = { path = "crates/swap/futarchy" }
beethoven-swap-gamma = { path = "crates/swap/gamma" }
beethoven-swap-scale-amm = { path = "crates/swap/scale-amm" }
beethoven-swap-scale-vmm = { path = "crates/swap/scale-vmm" }
beethoven-swap-omnipair = { path = "crates/swap/omnipair" }
beethoven-swap-hadron = { path = "crates/swap/hadron" }
beethoven-swap-raydium-cpmm = { path = "crates/swap/raydium-cpmm" }
base64 = "0.22"
litesvm = "0.12.0"
mollusk-svm = "0.12.0"
mollusk-svm-programs-token = "0.12.0"
pinocchio = { version = "0.11.1", default-features = false, features = ["alloc"] }
pinocchio-token = "0.6.0"
pinocchio-token-2022 = "0.3.1"
serde_json = "1"
solana-account = "3.3.0"
solana-account-decoder-client-types = "3"
solana-account-view = "2.0.0"
solana-address = "2.0.0"
solana-clock = "3.0.0"
solana-define-syscall = "4.0.1"
solana-instruction = "3.1.0"
solana-instruction-view = "2.1.0"
solana-keypair = "3.1.0"
solana-program-error = "3.0.0"
solana-program-option = "3.0.0"
solana-program-pack = "3.0.0"
solana-rent = "3.1.0"
solana-rpc-client = "3"
solana-rpc-client-api = "3"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
spl-token-2022-interface = "2"
spl-token-interface = "2"
thiserror = "2"
tokio = "1"

[dev-dependencies]
base64.workspace = true
litesvm.workspace = true
serde_json.workspace = true
solana-account.workspace = true
solana-clock.workspace = true
solana-instruction.workspace = true
solana-keypair.workspace = true
solana-program-option.workspace = true
solana-program-pack.workspace = true
solana-rent.workspace = true
solana-sdk-ids.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
spl-token-interface.workspace = true
mollusk-svm.workspace = true
mollusk-svm-programs-token.workspace = true
beethoven-client = { workspace = true, features = [
    "manifest",
    "gamma",
    "hadron",
    "raydium_cpmm",
    "resolve",
] }
solana-rpc-client.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
test = false
doctest = false
