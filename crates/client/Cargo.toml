[package]
name = "beethoven-client"
description = "Client-side helper for composing Beethoven swap and deposit instructions"
version = "0.0.1"
license = "MIT"
edition = "2021"

[features]
default = ["swap", "deposit", "resolve"]

swap = [
    "manifest",
    "aldrin",
    "aldrin-v2",
    "futarchy",
    "gamma",
    "omnipair",
    "hadron",
    "raydium-cpmm",
    "raydium-clmm",
    "perena",
    "heaven",
    "scale-amm",
    "scale-vmm",
    "solfi",
    "solfi-v2",
]

deposit = []

resolve = [
    "dep:solana-rpc-client",
    "dep:solana-rpc-client-api",
    "dep:solana-account",
    "dep:solana-account-decoder-client-types",
    "dep:spl-token-2022-interface",
]

manifest = []
aldrin = []
aldrin-v2 = []
futarchy = []
gamma = []
omnipair = []
hadron = []
raydium-cpmm = []
raydium-clmm = []
perena = []
heaven = []
scale-amm = []
scale-vmm = []
solfi = []
solfi-v2 = []

[dependencies]
solana-address = { workspace = true, features = ["curve25519"] }
solana-instruction.workspace = true
solana-rpc-client = { workspace = true, optional = true }
solana-rpc-client-api = { workspace = true, optional = true }
solana-account = { workspace = true, optional = true }
solana-account-decoder-client-types = { workspace = true, optional = true }
spl-token-2022-interface = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lib]
test = false
doctest = false
